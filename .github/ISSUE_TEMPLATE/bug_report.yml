name: Bug report
description: Report a problem with Friday Code
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for filing a bug! Please fill out the details below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `friday …`
        2. …
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Friday version
      description: Output of `friday --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (arm64)
        - macOS (x64)
        - Linux (x64)
        - Linux (arm64)
        - Windows (x64)
        - Other
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: e.g. iTerm2, Alacritty, Windows Terminal, VS Code
  - type: input
    id: provider
    attributes:
      label: Provider / model
      description: e.g. Anthropic claude-…, OpenAI gpt-…, Ollama …
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste any relevant output. Redact API keys.
      render: shell
