version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      bun-and-opentui:
        patterns:
          - "@opentui/*"
          - "bun"
          - "@types/bun"
      biome-and-ts:
        patterns:
          - "@biomejs/*"
          - "typescript"
          - "@types/*"
      runtime:
        patterns:
          - "solid-js"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
