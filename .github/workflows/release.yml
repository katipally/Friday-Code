name: Release

# Tag a release to trigger:  git tag v2.0.0 && git push origin v2.0.0
# Builds each platform binary on a native runner, publishes a GitHub Release with the
# binaries + checksums, then (after manual approval of the `release` environment)
# publishes the npm packages with provenance.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-13
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: win32-x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build ${{ matrix.target }}
        shell: bash
        run: bun run scripts/build.ts --target=${{ matrix.target }}
        env:
          FRIDAY_VERSION: ${{ github.ref_name }}

      - name: Smoke test the binary
        shell: bash
        run: |
          BIN=$(ls dist/bin/friday-${{ matrix.target }}*)
          OUT=$("$BIN" --version)
          echo "version: $OUT"
          test -n "$OUT"

      - name: Upload raw binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/bin/*

      - name: Upload platform npm package
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: dist/npm/friday-code-${{ matrix.target }}

      - name: Upload launcher npm package
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: npm-launcher
          path: dist/npm/friday-code

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bins
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd bins
          rm -f SHASUMS256.txt
          sha256sum friday-* > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: bins/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  npm-publish:
    name: npm publish
    needs: build
    runs-on: ubuntu-latest
    environment: release # requires manual approval before it runs
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm

      - name: Publish platform packages, then the launcher
        run: |
          set -e
          for dir in npm/npm-darwin-* npm/npm-linux-* npm/npm-win32-*; do
            echo "publishing $dir"
            npm publish "$dir" --provenance --access public
          done
          echo "publishing launcher"
          npm publish npm/npm-launcher --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
