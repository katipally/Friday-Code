name: Release

# Pushing a version tag triggers the full pipeline automatically:
#   git tag v2.0.1 && git push origin v2.0.1
#
# The workflow builds binaries on native runners, creates a GitHub Release,
# then publishes all npm packages. The publish step is idempotent — if a
# platform package is already on npm at that version it is skipped rather
# than failing, so reruns and retries always complete successfully.
#
# Use workflow_dispatch to rerun a specific tag (e.g. after a flaky runner).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build/publish, e.g. v2.0.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: win32-x64
            runner: windows-latest
          - target: win32-arm64
            runner: windows-11-arm
          - target: linux-x64-musl
            runner: ubuntu-latest
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      # Musl targets build inside an Alpine container so Bun links against musl libc.
      - name: Set up Alpine container (musl targets only)
        if: contains(matrix.target, 'musl')
        uses: jirutka/setup-alpine@v1
        with:
          branch: v3.21
          packages: curl bash

      - name: Install Bun (musl/Alpine)
        if: contains(matrix.target, 'musl')
        shell: alpine.sh {0}
        run: |
          curl -fsSL https://bun.sh/install | bash -s -- bun-v1.3.11
          echo "/root/.bun/bin" >> $GITHUB_PATH

      - uses: oven-sh/setup-bun@v2
        if: "!contains(matrix.target, 'musl')"
        with:
          bun-version: "1.3.11"

      - name: Install dependencies (musl/Alpine)
        if: contains(matrix.target, 'musl')
        shell: alpine.sh {0}
        run: /root/.bun/bin/bun install --frozen-lockfile

      - name: Install dependencies
        if: "!contains(matrix.target, 'musl')"
        run: bun install --frozen-lockfile

      - name: Build ${{ matrix.target }} (musl/Alpine)
        if: contains(matrix.target, 'musl')
        shell: alpine.sh {0}
        run: /root/.bun/bin/bun run scripts/build.ts --target=${{ matrix.target }}
        env:
          FRIDAY_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Build ${{ matrix.target }}
        if: "!contains(matrix.target, 'musl')"
        shell: bash
        run: bun run scripts/build.ts --target=${{ matrix.target }}
        env:
          FRIDAY_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Smoke test the binary
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          EXPECTED="${TAG#v}"
          BIN=$(ls dist/bin/friday-${{ matrix.target }}*)
          OUT=$("$BIN" --version)
          echo "version: $OUT"
          test "$OUT" = "$EXPECTED"

      - name: Upload raw binary
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/bin/*

      - name: Upload platform npm package
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.target }}
          path: dist/npm/friday-code-${{ matrix.target }}

      - name: Upload launcher npm package
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: npm-launcher
          path: dist/npm/friday-code

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: bins
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd bins
          rm -f SHASUMS256.txt
          sha256sum friday-* > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: bins/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  npm-publish:
    name: npm publish
    needs: github-release
    runs-on: ubuntu-latest
    environment: release # optional extra reviewer gate in repo settings
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: npm

      - name: Verify npm artifacts
        shell: bash
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64 win32-arm64 linux-x64-musl linux-arm64-musl; do
            test -f "./npm/npm-$target/package.json" || { echo "Missing artifact for $target"; exit 1; }
          done
          test -f "./npm/npm-launcher/package.json"

      - name: Publish platform packages (idempotent), then the launcher
        shell: bash
        run: |
          set -euo pipefail

          publish_idempotent() {
            local dir="$1"
            local pkg version
            pkg=$(node -p "require('$dir/package.json').name")
            version=$(node -p "require('$dir/package.json').version")
            local already
            already=$(npm view "${pkg}@${version}" version 2>/dev/null || true)
            if [ "$already" = "$version" ]; then
              echo "skip  $pkg@$version (already published)"
              return 0
            fi
            echo "publishing $pkg@$version"
            npm publish "$dir" --provenance --access public
          }

          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64 win32-arm64 linux-x64-musl linux-arm64-musl; do
            publish_idempotent "./npm/npm-$target"
          done

          echo "publishing launcher"
          npm publish ./npm/npm-launcher --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
