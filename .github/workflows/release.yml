name: Release

# Tag a release to trigger binary builds and GitHub Release assets:
#   git tag v2.0.0 && git push origin v2.0.0
#
# npm publishing is intentionally manual: run this workflow from GitHub Actions with
# tag=v2.0.0 and publish_npm=true. The `release` environment can add an extra reviewer gate.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build/publish, e.g. v2.0.0"
        required: true
        type: string
      publish_npm:
        description: "Publish npm packages after building release artifacts"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: win32-x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build ${{ matrix.target }}
        shell: bash
        run: bun run scripts/build.ts --target=${{ matrix.target }}
        env:
          FRIDAY_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Smoke test the binary
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          EXPECTED="${TAG#v}"
          BIN=$(ls dist/bin/friday-${{ matrix.target }}*)
          OUT=$("$BIN" --version)
          echo "version: $OUT"
          test "$OUT" = "$EXPECTED"

      - name: Upload raw binary
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/bin/*

      - name: Upload platform npm package
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.target }}
          path: dist/npm/friday-code-${{ matrix.target }}

      - name: Upload launcher npm package
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: npm-launcher
          path: dist/npm/friday-code

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: bins
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd bins
          rm -f SHASUMS256.txt
          sha256sum friday-* > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: bins/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  npm-publish:
    name: npm publish
    needs: github-release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_npm
    runs-on: ubuntu-latest
    environment: release # optional extra reviewer gate in repo settings
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: npm

      - name: Verify npm artifacts
        shell: bash
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            test -f "./npm/npm-$target/package.json"
          done
          test -f "./npm/npm-launcher/package.json"

      - name: Publish platform packages, then the launcher
        shell: bash
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            dir="./npm/npm-$target"
            echo "publishing $dir"
            npm publish "$dir" --provenance --access public
          done
          echo "publishing launcher"
          npm publish ./npm/npm-launcher --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
