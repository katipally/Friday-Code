name: Release

# Pushing a `v*` tag triggers the full pipeline:
#   git tag v2.0.1 && git push origin v2.0.1
#
# Layout:
#   1. version     – derive VERSION from the tag
#   2. build       – one matrix of 8 native runners
#                    • 5 stable (darwin-arm64/x64, linux-x64/arm64, win32-x64) must succeed
#                    • 3 best-effort (linux-x64-musl, linux-arm64-musl, win32-arm64)
#   3. release     – downloads all binaries → creates GitHub Release + SHASUMS256.txt
#                    (only requires the STABLE builds; best-effort failures are OK)
#   4. npm-publish – downloads npm-* artifacts, rebuilds the launcher package,
#                    publishes npm + opens PRs on the Homebrew tap and Scoop bucket.
#                    Gated by the `release` GitHub Environment (manual approval).
#
# Trigger manually with a specific tag to retry:
#   GitHub Actions → Release → Run workflow → tag: v2.0.1

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v2.0.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Derive VERSION + TAG from the trigger ──────────────────────────────
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag:     ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - id: v
        # Pure bash — no bun runtime dependency. scripts/version.ts is also
        # available locally for `bun run version`, but the workflow avoids it
        # to sidestep the intermittent bun 1.3.x @babel/traverse flake.
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "version: invalid tag \"$TAG\" (expected vX.Y.Z[-suffix])" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"
          echo "tag=$TAG"

  # ── 2. Build matrix (8 targets on native runners) ─────────────────────────
  build:
    name: build ${{ matrix.group }} · ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # STABLE — failures block the release
          - { group: stable, target: darwin-arm64,    runner: macos-15 }
          - { group: stable, target: darwin-x64,      runner: macos-15-intel }
          - { group: stable, target: linux-x64,       runner: ubuntu-latest }
          - { group: stable, target: linux-arm64,     runner: ubuntu-24.04-arm }
          - { group: stable, target: win32-x64,       runner: windows-latest }
          # MUSL — best-effort (Alpine container for static libc)
          - { group: musl,   target: linux-x64-musl,  runner: ubuntu-latest }
          - { group: musl,   target: linux-arm64-musl, runner: ubuntu-24.04-arm }
          # WINDOWS-ARM — best-effort (separate runner image)
          - { group: winarm, target: win32-arm64,      runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }

      # Musl variants: build AND smoke-test inside Alpine (the musl-linked binary
      # can't be exec'd on the glibc host, so the standalone smoke-test step below
      # is skipped for this group).
      - name: Build ${{ matrix.target }} (Alpine) + smoke test
        if: matrix.group == 'musl'
        env:
          EXPECTED: ${{ needs.version.outputs.version }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e FRIDAY_VERSION="$EXPECTED" \
            oven/bun:1.3.11-alpine \
            sh -c "bun install --frozen-lockfile && \
                   bun run scripts/build.ts --target=${{ matrix.target }} && \
                   ./dist/bin/friday-${{ matrix.target }} --version | grep -Fxq \"$EXPECTED\" && \
                   echo 'musl smoke test: OK'"
          sudo chown -R $USER:$USER dist/

      - name: Setup Bun
        if: matrix.group != 'musl'
        uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.11" }

      - name: Install dependencies
        if: matrix.group != 'musl'
        run: bun install --frozen-lockfile

      - name: Build ${{ matrix.target }}
        if: matrix.group != 'musl'
        run: bun run scripts/build.ts --target=${{ matrix.target }}
        env:
          FRIDAY_VERSION: ${{ needs.version.outputs.version }}

      - name: Smoke test (--version)
        if: matrix.group != 'musl'
        shell: bash
        run: |
          EXPECTED=${{ needs.version.outputs.version }}
          BIN=$(ls dist/bin/friday-${{ matrix.target }}*)
          OUT=$("$BIN" --version)
          echo "binary: $OUT  expected: $EXPECTED"
          test "$OUT" = "$EXPECTED"

      # Package the per-target npm dir into a single tarball whose top-level
      # component is `npm/<target>/`. Plain `actions/upload-artifact` flattens
      # the source directory (the top-level name is stripped), so 8 separate
      # `npm-<target>` zips end up with identical contents and overwrite each
      # other when `merge-multiple: true` is used downstream. A tarball is
      # one file; the structure is preserved on extract by `npm-publish`.
      - name: Package dist/npm/${{ matrix.target }} for upload
        if: always()
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "dist/npm/${TARGET}" ]; then
            echo "✖ dist/npm/${TARGET} missing — build did not produce it" >&2
            exit 1
          fi
          tar --create --gzip \
            --file "dist/npm-${TARGET}.tar.gz" \
            -C dist "npm/${TARGET}"
          ls -la "dist/npm-${TARGET}.tar.gz"

      - name: Upload raw binary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/bin/*
          if-no-files-found: ignore

      - name: Upload platform npm package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.target }}
          # Upload the tarball (one file), not the source dir. The tarball
          # preserves `npm/<target>/` structure across the upload/download
          # round-trip — see "Package dist/npm/<target>" step for context.
          path: dist/npm-${{ matrix.target }}.tar.gz
          if-no-files-found: ignore

  # ── 3. GitHub Release (requires the 5 STABLE builds) ─────────────────────
  release:
    name: GitHub Release
    needs: [version, build]
    # All 5 stable matrix entries must be `success` (or `skipped`); musl + win-arm
    # are best-effort and ignored here.
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag:     ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        run: |
          echo "version=${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ needs.version.outputs.tag }}"         >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: bins
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd bins
          rm -f SHASUMS256.txt
          sha256sum friday-* > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: bins/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload SHASUMS256.txt for downstream jobs
        uses: actions/upload-artifact@v7
        with:
          name: shasums
          path: bins/SHASUMS256.txt

  # ── 4. npm publish + external indexes (manual approval gate) ─────────────
  npm-publish:
    name: npm publish + indexes
    needs: release
    runs-on: ubuntu-latest
    environment: release     # ← Settings → Environments → `release` → required reviewer
    permissions:
      contents: read
      id-token: write        # npm provenance
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.11" }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build the launcher FIRST — it does `rm -rf dist/` at the start, so it
      # must run before the artifact download (otherwise it would wipe the
      # downloaded platform packages).
      - name: Build launcher package
        run: bun run scripts/build.ts --target=__launcher__
        env:
          FRIDAY_VERSION: ${{ needs.release.outputs.tag }}

      # Download each per-platform tarball by name and untar into dist/npm/.
      # We avoid `actions/download-artifact`'s `merge-multiple: true` because
      # it flattens identical top-level paths and overwrites siblings — the
      # exact bug that broke v2.0.0–v2.0.6. Per-target downloads via
      # `gh run download` keep each `<target>/` subdir intact.
      - name: Restore per-platform npm packages
        env:
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/npm _artifacts
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64 \
                   linux-x64-musl linux-arm64-musl win32-x64 win32-arm64; do
            echo "▸ downloading npm-$t"
            gh run download "$RUN_ID" --name "npm-$t" --dir "_artifacts/npm-$t"
            # `actions/upload-artifact` strips the source directory and only
            # preserves the file's basename, so the tarball lands at
            # `_artifacts/npm-$t/npm-$t.tar.gz` (no `dist/` prefix). Use
            # `find` so we don't break if upload-artifact ever changes its
            # path layout again.
            tarball=$(find "_artifacts/npm-$t" -type f -name "*.tar.gz" | head -1)
            if [ -z "$tarball" ]; then
              echo "✖ no .tar.gz found under _artifacts/npm-$t" >&2
              find "_artifacts/npm-$t" >&2
              exit 1
            fi
            tar -xzf "$tarball" -C dist/npm --strip-components=1
          done
          echo "---"
          find dist/npm -maxdepth 2 -name package.json | sort

      - name: Validate dist/npm layout
        # Fail loudly BEFORE npm publish if a stable target's dir is missing
        # (best-effort ones are tolerated). publish.ts would otherwise fail
        # partway through the publish loop with a less actionable error.
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64 friday-code; do
            if [ ! -f "dist/npm/$t/package.json" ]; then
              missing+=("$t")
            else
              node -e "JSON.parse(require('fs').readFileSync('dist/npm/$t/package.json'))"
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "✖ missing package.json in: ${missing[*]}" >&2
            exit 1
          fi
          echo "✓ 6 required npm packages present and parseable"

      - name: Publish npm + open Homebrew/Scoop PRs
        run: bun run scripts/publish.ts
        env:
          VERSION:           ${{ needs.release.outputs.version }}
          NODE_AUTH_TOKEN:   ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN:      ${{ secrets.RELEASE_TOKEN }}
          HOMEBREW_TAP_REPO: katipally/homebrew-tap
          SCOOP_BUCKET_REPO: katipally/scoop-bucket
          FRIDAY_REPO:       katipally/friday-code
