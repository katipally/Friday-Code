name: Release

# Pushing a `v*` tag triggers the full pipeline:
#   git tag v2.0.1 && git push origin v2.0.1
#
# Layout:
#   1. version     – derive VERSION from the tag
#   2. build       – one matrix of 8 native runners
#                    • 5 stable (darwin-arm64/x64, linux-x64/arm64, win32-x64) must succeed
#                    • 3 best-effort (linux-x64-musl, linux-arm64-musl, win32-arm64)
#   3. release     – downloads all binaries → creates GitHub Release + SHASUMS256.txt
#                    (only requires the STABLE builds; best-effort failures are OK)
#   4. npm-publish – downloads npm-* artifacts, rebuilds the launcher package,
#                    publishes npm + opens PRs on the Homebrew tap and Scoop bucket.
#                    Gated by the `release` GitHub Environment (manual approval).
#
# Trigger manually with a specific tag to retry:
#   GitHub Actions → Release → Run workflow → tag: v2.0.1

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v2.0.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Derive VERSION + TAG from the trigger ──────────────────────────────
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag:     ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - id: v
        # Pure bash — no bun runtime dependency. scripts/version.ts is also
        # available locally for `bun run version`, but the workflow avoids it
        # to sidestep the intermittent bun 1.3.x @babel/traverse flake.
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "version: invalid tag \"$TAG\" (expected vX.Y.Z[-suffix])" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"
          echo "tag=$TAG"

  # ── 2. Build matrix (8 targets on native runners) ─────────────────────────
  build:
    name: build ${{ matrix.group }} · ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # STABLE — failures block the release
          - { group: stable, target: darwin-arm64,    runner: macos-15 }
          - { group: stable, target: darwin-x64,      runner: macos-15-intel }
          - { group: stable, target: linux-x64,       runner: ubuntu-latest }
          - { group: stable, target: linux-arm64,     runner: ubuntu-24.04-arm }
          - { group: stable, target: win32-x64,       runner: windows-latest }
          # MUSL — best-effort (Alpine container for static libc)
          - { group: musl,   target: linux-x64-musl,  runner: ubuntu-latest }
          - { group: musl,   target: linux-arm64-musl, runner: ubuntu-24.04-arm }
          # WINDOWS-ARM — best-effort (separate runner image)
          - { group: winarm, target: win32-arm64,      runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }

      # Musl variants: build AND smoke-test inside Alpine (the musl-linked binary
      # can't be exec'd on the glibc host, so the standalone smoke-test step below
      # is skipped for this group).
      - name: Build ${{ matrix.target }} (Alpine) + smoke test
        if: matrix.group == 'musl'
        env:
          EXPECTED: ${{ needs.version.outputs.version }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e FRIDAY_VERSION="$EXPECTED" \
            oven/bun:1.3.11-alpine \
            sh -c "bun install --frozen-lockfile && \
                   bun run scripts/build.ts --target=${{ matrix.target }} && \
                   ./dist/bin/friday-${{ matrix.target }} --version | grep -Fxq \"$EXPECTED\" && \
                   echo 'musl smoke test: OK'"
          sudo chown -R $USER:$USER dist/

      - name: Setup Bun
        if: matrix.group != 'musl'
        uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.11" }

      - name: Install dependencies
        if: matrix.group != 'musl'
        run: bun install --frozen-lockfile

      - name: Build ${{ matrix.target }}
        if: matrix.group != 'musl'
        run: bun run scripts/build.ts --target=${{ matrix.target }}
        env:
          FRIDAY_VERSION: ${{ needs.version.outputs.version }}

      - name: Smoke test (--version)
        if: matrix.group != 'musl'
        shell: bash
        run: |
          EXPECTED=${{ needs.version.outputs.version }}
          BIN=$(ls dist/bin/friday-${{ matrix.target }}*)
          OUT=$("$BIN" --version)
          echo "binary: $OUT  expected: $EXPECTED"
          test "$OUT" = "$EXPECTED"

      - name: Upload raw binary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/bin/*
          if-no-files-found: ignore

      - name: Upload platform npm package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.target }}
          # dist/npm/<target>/ contains package.json + bin/. Uploading the
          # subdir (not the file paths) preserves the target name in the
          # zip so the npm-publish job can extract it under the same name.
          path: dist/npm/${{ matrix.target }}
          if-no-files-found: ignore

  # ── 3. GitHub Release (requires the 5 STABLE builds) ─────────────────────
  release:
    name: GitHub Release
    needs: [version, build]
    # All 5 stable matrix entries must be `success` (or `skipped`); musl + win-arm
    # are best-effort and ignored here.
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag:     ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        run: |
          echo "version=${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ needs.version.outputs.tag }}"         >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: bins
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd bins
          rm -f SHASUMS256.txt
          sha256sum friday-* > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: bins/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload SHASUMS256.txt for downstream jobs
        uses: actions/upload-artifact@v7
        with:
          name: shasums
          path: bins/SHASUMS256.txt

  # ── 4. npm publish + external indexes (manual approval gate) ─────────────
  npm-publish:
    name: npm publish + indexes
    needs: release
    runs-on: ubuntu-latest
    environment: release     # ← Settings → Environments → `release` → required reviewer
    permissions:
      contents: read
      id-token: write        # npm provenance
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.11" }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build the launcher FIRST — it does `rm -rf dist/` at the start, so it
      # must run before the artifact download (otherwise it would wipe the
      # downloaded platform packages).
      - name: Build launcher package
        run: bun run scripts/build.ts --target=__launcher__
        env:
          FRIDAY_VERSION: ${{ needs.release.outputs.tag }}

      # Download the per-platform packages. merge-multiple + the existing
      # dist/npm/friday-code/ directory → all 9 packages coexist.
      - uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: dist/npm
          merge-multiple: true

      - name: Publish npm + open Homebrew/Scoop PRs
        run: bun run scripts/publish.ts
        env:
          VERSION:           ${{ needs.release.outputs.version }}
          NODE_AUTH_TOKEN:   ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN:      ${{ secrets.RELEASE_TOKEN }}
          HOMEBREW_TAP_REPO: katipally/homebrew-tap
          SCOOP_BUCKET_REPO: katipally/scoop-bucket
          FRIDAY_REPO:       katipally/friday-code
