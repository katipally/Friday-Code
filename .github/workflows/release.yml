name: Release

# Pushing a version tag triggers the full pipeline automatically:
#   git tag v2.0.1 && git push origin v2.0.1
#
# Stable targets (darwin-arm64, darwin-x64, linux-x64, linux-arm64, win32-x64) must
# all succeed for the GitHub Release and npm publish to proceed.
# Experimental targets (linux musl, win32-arm64) run in parallel but do not block
# the release — their packages are published if the builds succeed.
#
# The publish step is fully idempotent: if a package@version is already on npm it is
# skipped rather than failing, so reruns and retries always complete successfully.
#
# Use workflow_dispatch to rerun a specific tag (e.g. after a flaky runner).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build/publish, e.g. v2.0.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# ── Stable targets ─────────────────────────────────────────────────────────────
jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: win32-x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build ${{ matrix.target }}
        shell: bash
        run: bun run scripts/build.ts --target=${{ matrix.target }}
        env:
          FRIDAY_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Smoke test the binary
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          EXPECTED="${TAG#v}"
          BIN=$(ls dist/bin/friday-${{ matrix.target }}*)
          OUT=$("$BIN" --version)
          echo "version: $OUT"
          test "$OUT" = "$EXPECTED"

      - name: Upload raw binary
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/bin/*

      - name: Upload platform npm package
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.target }}
          path: dist/npm/friday-code-${{ matrix.target }}

      - name: Upload launcher npm package
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: npm-launcher
          path: dist/npm/friday-code

# ── Musl targets (Alpine/Docker) ───────────────────────────────────────────────
  build-musl:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-musl
            runner: ubuntu-latest
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Build ${{ matrix.target }} (musl via Docker)
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e FRIDAY_VERSION="$TAG" \
            oven/bun:1.3.11-alpine \
            sh -c "bun install --frozen-lockfile && bun run scripts/build.ts --target=${{ matrix.target }}"
          sudo chown -R $USER:$USER dist/

      - name: Smoke test the binary
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          EXPECTED="${TAG#v}"
          BIN=$(ls dist/bin/friday-${{ matrix.target }})
          OUT=$("$BIN" --version)
          echo "version: $OUT"
          test "$OUT" = "$EXPECTED"

      - name: Upload raw binary
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/bin/*

      - name: Upload platform npm package
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.target }}
          path: dist/npm/friday-code-${{ matrix.target }}

# ── Windows ARM64 ──────────────────────────────────────────────────────────────
  build-win-arm64:
    name: build win32-arm64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build win32-arm64
        shell: bash
        run: bun run scripts/build.ts --target=win32-arm64
        env:
          FRIDAY_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Smoke test the binary
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          EXPECTED="${TAG#v}"
          BIN=$(ls dist/bin/friday-win32-arm64*)
          OUT=$("$BIN" --version)
          echo "version: $OUT"
          test "$OUT" = "$EXPECTED"

      - name: Upload raw binary
        uses: actions/upload-artifact@v7
        with:
          name: bin-win32-arm64
          path: dist/bin/*

      - name: Upload platform npm package
        uses: actions/upload-artifact@v7
        with:
          name: npm-win32-arm64
          path: dist/npm/friday-code-win32-arm64

# ── GitHub Release ─────────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    # Experimental builds (musl, win-arm64) do not block the release.
    needs: [build, build-musl, build-win-arm64]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: bins
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd bins
          rm -f SHASUMS256.txt
          sha256sum friday-* > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: bins/*
          generate_release_notes: true
          fail_on_unmatched_files: true

# ── npm publish ────────────────────────────────────────────────────────────────
  npm-publish:
    name: npm publish
    needs: github-release
    runs-on: ubuntu-latest
    environment: release # optional extra reviewer gate in repo settings
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: npm

      - name: Verify required npm artifacts
        shell: bash
        run: |
          set -euo pipefail
          # Stable packages must always be present.
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            test -f "./npm/npm-$target/package.json" || { echo "Missing required artifact: $target"; exit 1; }
          done
          test -f "./npm/npm-launcher/package.json"
          # Log optional experimental packages (do not fail if missing).
          for target in win32-arm64 linux-x64-musl linux-arm64-musl; do
            if test -f "./npm/npm-$target/package.json"; then
              echo "found experimental: $target"
            else
              echo "missing experimental (ok): $target"
            fi
          done

      - name: Publish all packages (idempotent), then the launcher
        shell: bash
        run: |
          set -euo pipefail

          publish_idempotent() {
            local dir="$1"
            local pkg version already
            pkg=$(node -p "require('$dir/package.json').name")
            version=$(node -p "require('$dir/package.json').version")
            already=$(npm view "${pkg}@${version}" version 2>/dev/null || true)
            if [ "$already" = "$version" ]; then
              echo "skip  $pkg@$version (already published)"
              return 0
            fi
            echo "publishing $pkg@$version"
            npm publish "$dir" --provenance --access public
          }

          # Stable packages (always present).
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            publish_idempotent "./npm/npm-$target"
          done

          # Experimental packages (publish if artifact was uploaded, skip if not).
          for target in win32-arm64 linux-x64-musl linux-arm64-musl; do
            if [ -d "./npm/npm-$target" ]; then
              publish_idempotent "./npm/npm-$target"
            fi
          done

          # Launcher is always last and always required.
          publish_idempotent "./npm/npm-launcher"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
